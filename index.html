            <!-- App Logo -->

                <div class="absolute -inset-1 bg-gradient-to-r from-emerald-500 to-cyan-500 rounded-2xl blur opacity-30 group-hover:opacity-60 transition duration-300"></div>
                <img 
                    src="https://raw.githubusercontent.com/VPS-SCRIPT/activevpn-premium/main/PNG/1787574190521.png" 
                    alt="Active VPN Logo"

                    onerror="handleImgError(this, 'https://cdn.jsdelivr.net/gh/VPS-SCRIPT/activevpn-premium@main/PNG/1787574190521.png')"

            <!-- Title & Version -->

            <div class="flex items-center gap-2 mb-6">

                    ဗားရှင်း 1.0 (APK)
                </span>
                <span class="px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700">
                    Android
                </span>
            </div>

            <!-- Download Action Button -->
            <a 
                href="https://github.com/VPS-SCRIPT/activevpn-premium/releases/download/V1.0.apk/Active.VPN_1.0.apk" 
                class="w-full group relative flex items-center justify-center gap-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-bold py-4 px-6 rounded-2xl transition-all duration-200 shadow-lg shadow-emerald-950/50 hover:shadow-emerald-500/20 active:scale-[0.98]"
            >
                <svg class="w-6 h-6 transition-transform duration-200 group-hover:-translate-y-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                <span class="text-base tracking-wide">APK ဒေါင်းလုဒ်ဆွဲရန်</span>
            </a>

            <!-- Secondary Actions -->
            <div class="w-full mt-4 flex items-center justify-between gap-2 pt-4 border-t border-slate-800/80">
                <button 
                    onclick="copyDownloadLink()" 
                    class="w-full inline-flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-slate-800/60 hover:bg-slate-800 text-xs font-medium text-slate-300 border border-slate-700/50 transition-colors"
                >
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                    </svg>
                    <span id="copyBtnText">ဒေါင်းလုဒ်လင့်ခ် ကူးယူရန်</span>
                </button>
            </div>
        </div>

        <!-- Screenshots Section (ပုံ ၂ ပုံ) -->
        <div class="w-full bg-slate-900/60 border border-slate-800 rounded-3xl p-5 sm:p-6 shadow-xl">
            <h2 class="text-base font-semibold text-slate-200 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                App ပုံစံနမူနာများ
            </h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="overflow-hidden rounded-2xl border border-slate-700/50 bg-slate-950 flex items-center justify-center min-h-[220px]">
                    <img 
                        src="https://raw.githubusercontent.com/VPS-SCRIPT/activevpn-premium/main/PNG/active1.png" 
                        alt="Active VPN Screenshot 1" 
                        referrerpolicy="no-referrer"
                        onerror="handleImgError(this, 'https://cdn.jsdelivr.net/gh/VPS-SCRIPT/activevpn-premium@main/PNG/active1.png')"
                        class="w-full h-auto object-cover hover:scale-105 transition duration-300 rounded-2xl"
                    />
                </div>
                <div class="overflow-hidden rounded-2xl border border-slate-700/50 bg-slate-950 flex items-center justify-center min-h-[220px]">
                    <img 
                        src="https://raw.githubusercontent.com/VPS-SCRIPT/activevpn-premium/main/PNG/active2.png" 
                        alt="Active VPN Screenshot 2" 
                        referrerpolicy="no-referrer"
                        onerror="handleImgError(this, 'https://cdn.jsdelivr.net/gh/VPS-SCRIPT/activevpn-premium@main/PNG/active2.png')"
                        class="w-full h-auto object-cover hover:scale-105 transition duration-300 rounded-2xl"
                    />
                </div>
            </div>
        </div>

        <!-- Video Guide Section (Premium ဝယ်နည်း ဗီဒီယို) -->
        <div class="w-full bg-slate-900/60 border border-slate-800 rounded-3xl p-5 sm:p-6 shadow-xl mb-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-base font-semibold text-slate-200 flex items-center gap-2">
                    <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    Premium ဝယ်ယူနည်း ဗီဒီယို
                </h2>
                <span class="text-xs bg-slate-800 text-emerald-400 font-medium px-2.5 py-1 rounded-full border border-slate-700">
                    ကြာချိန် ~ ၅ မိနစ်
                </span>
            </div>

            <!-- HTML5 Video Player -->
            <div class="relative rounded-2xl overflow-hidden border border-slate-700/60 bg-black aspect-video flex items-center justify-center group shadow-lg">
                <video 
                    controls 
                    preload="metadata"
                    class="w-full h-full object-contain"
                >
                    <source src="how-to-buy-premium.mp4" type="video/mp4">
                    သင့် Browser သည် HTML5 Video ကို အထောက်အပံ့ မပေးပါ။
                </video>
            </div>
            
            <p class="text-xs text-slate-400 mt-3 text-center">
                * ဗီဒီယိုကို ကြည့်ရှု၍ Premium အကောင့် အလွယ်တကူ ဝယ်ယူအသုံးပြုနိုင်ပါသည်။
            </p>
        </div>

    </div>

    <!-- Hidden input for clipboard -->
    <input 
        type="text" 
        id="downloadUrlInput" 
        value="https://github.com/VPS-SCRIPT/activevpn-premium/releases/download/V1.0.apk/Active.VPN_1.0.apk" 
        class="sr-only" 
        tabindex="-1"
        aria-hidden="true"
    />

    <!-- Status Toast -->
    <div id="toast" class="hidden fixed bottom-6 bg-emerald-500 text-slate-950 text-xs font-bold px-5 py-2.5 rounded-full shadow-2xl transition-opacity duration-300 z-50">
        လင့်ခ် ကူးယူပြီးပါပြီ!
    </div>

    <!-- Scripts -->
    <script>
        // Image Fallback Handling
        function handleImgError(imgElement, fallbackUrl) {
            if (!imgElement.dataset.retried) {
                imgElement.dataset.retried = "true";
                imgElement.src = fallbackUrl;
            }
        }

        // Copy Download Link Function
        function copyDownloadLink() {
            var copyInput = document.getElementById("downloadUrlInput");
            copyInput.select();
            copyInput.setSelectionRange(0, 99999);

            try {
                document.execCommand("copy");
                showToast();
            } catch (err) {
                console.error("Copy failed", err);
            }
        }

        function showToast() {
            var toast = document.getElementById("toast");
            var btnText = document.getElementById("copyBtnText");
            
            toast.classList.remove("hidden");
            btnText.textContent = "ကူးယူပြီး ✓";

            setTimeout(function() {
                toast.classList.add("hidden");
                btnText.textContent = "ဒေါင်းလုဒ်လင့်ခ် ကူးယူရန်";
            }, 2000);
        }
    </script>
</body>
</html>
